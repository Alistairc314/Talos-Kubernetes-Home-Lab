apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
  proxmox.yaml: ""
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab Dashboard
    theme: dark
    color: slate
    useEqualHeights: true
    layout:
      Infrastructure:
        style: row
        columns: 3
  bookmarks.yaml: |
    - Dev:
        - GitHub:
            - href: https://github.com/Alistairc314
              icon: github.png
  services.yaml: |
    - Infrastructure:
        - Pi-hole:
            href: http://192.168.1.200/admin
            description: DNS Filtering
            icon: pi-hole.png
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "homelab"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short