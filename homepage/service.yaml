apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.201
spec:
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
  type: LoadBalancer